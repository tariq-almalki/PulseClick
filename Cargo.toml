[package]
name = "pulseclick"
version = "1.1.0"
edition = "2021"
description = "A fast, cross-platform desktop auto-clicker built in Rust"
license = "MIT"

[dependencies]
enigo = "0.6.1"
eframe = { version = "0.29", default-features = true }
global-hotkey = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
